# Local development database for KemiKoll.
#
#   Start:  docker compose up -d
#   Stop:   docker compose down        (data is kept)
#   Reset:  docker compose down -v     (deletes all data!)
#
# Settings (user name, password, port) are read from the .env file next to this file.
# Copy .env.example to .env first. The .env file is ignored by Git.

name: kemikoll

services:
  postgres:
    image: postgres:17
    container_name: kemikoll-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kemikoll}
      POSTGRES_USER: ${POSTGRES_USER:-kemikoll}
      # No default on purpose: Compose stops with an error if .env is missing.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy .env.example to .env)}
    ports:
      # Bound to 127.0.0.1 so the database is reachable only from this computer, not from the network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Named volume: the data survives restarts of the container and of Docker.
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Docker Desktop shows the container as "healthy" once the database accepts connections.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
